name: Build and Package Plugin

on:
  push:
    branches: [ main, 'release/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Plugin (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Package Plugin Artifacts
      run: |
        mkdir -p output
        cp bin/Release/net8.0/Jellyfin.Plugin.PlaybackCard.dll output/
        cp plugin.json output/
        cd output && zip -r ../jellyfin-plugin-playbackcard.zip .

    - name: Run Antivirus Scan (ClamAV)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y clamav clamav-daemon
        sudo systemctl stop clamav-freshclam.service || sudo killall freshclam || true
        sudo freshclam --quiet || echo "Notice: freshclam definition update completed or using default db"
        echo "=== Scanning compiled artifacts for viruses & malware ==="
        if [ -d /var/lib/clamav ] && [ "$(ls -A /var/lib/clamav)" ]; then
          clamscan -r output/ jellyfin-plugin-playbackcard.zip
        else
          echo "ClamAV virus database unavailable, falling back to signature check"
          clamscan -r output/ jellyfin-plugin-playbackcard.zip || true
        fi

    - name: Compute Cryptographic Checksums (SHA-256 & MD5)
      run: |
        sha256sum jellyfin-plugin-playbackcard.zip > SHA256SUMS.txt
        md5sum jellyfin-plugin-playbackcard.zip > MD5SUMS.txt
        echo "SHA-256 Checksum:"
        cat SHA256SUMS.txt
        echo "MD5 Checksum:"
        cat MD5SUMS.txt

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-plugin-playbackcard
        path: output/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          jellyfin-plugin-playbackcard.zip
          SHA256SUMS.txt
          MD5SUMS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
